name: ambulance
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.0.5

environment:
  sdk: ^3.5.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Add this line
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  auto_route: ^9.2.0
  cupertino_icons: ^1.0.5
  flutter_svg: ^2.0.7
  dio: ^5.3.2
  get_it: ^7.6.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  talker_flutter: ^3.2.10
  talker_dio_logger: ^2.3.0
  talker_bloc_logger: ^2.2.0
  firebase_core: ^2.15.1
  retrofit: ^4.4.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.0
  mask_text_input_formatter: ^2.5.0
  flutter_localization: ^0.1.13
  jwt_decoder: ^2.0.1
  firebase_messaging: ^14.6.7
  flutter_local_notifications: ^17.2.1
  url_launcher: ^6.1.14
  package_info_plus: ^8.1.0
  location: ^5.0.3
  geocoding: ^2.1.1
  intl: ^0.19.0
  multi_dropdown: ^2.1.2
  internet_connection_checker: ^1.0.0+1
  image_picker: ^1.0.8
  win32: ^5.5.0
  permission_handler: ^11.3.1
  toastification: ^2.3.0
  firebase_crashlytics: ^3.5.7
  numberpicker: ^2.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^9.0.0
  json_serializable: ^6.9.0
  build_runner: ^2.4.6
  flutter_launcher_icons: "^0.14.1"
  retrofit_generator: '>=8.0.0 <10.0.0'


  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/icon/icon.png"
  image_path_ios: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon.png"
  adaptive_icon_background: "#000000"
  background_color_ios: "#ffffff"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/ 
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Thin.ttf
          weight: 100
          style: normal
        - asset: assets/fonts/NotoSans-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/NotoSans-ExtraLight.ttf
          weight: 200
          style: normal
        - asset: assets/fonts/NotoSans-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/NotoSans-Light.ttf
          weight: 300
          style: normal
        - asset: assets/fonts/NotoSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
          style: normal
        - asset: assets/fonts/NotoSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
          style: normal
        - asset: assets/fonts/NotoSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
          style: normal
        - asset: assets/fonts/NotoSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/NotoSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/NotoSans-ExtraBold.ttf
          weight: 800
          style: normal
        - asset: assets/fonts/NotoSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/NotoSans-Black.ttf
          weight: 900
          style: normal
        - asset: assets/fonts/NotoSans-BlackItalic.ttf
          weight: 900
          style: italic
