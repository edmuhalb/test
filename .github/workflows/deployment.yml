name: Team app deployment on the prod server
run-name: ${{ github.actor }} starting deployment 🚀
on:
  push:
    branches:
      - main
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install deps
              run: npm install
            - name: Lint
              run: npm run lint
            - name: Build
              run: npm run build
            - name: FTP Deploy to (Staging)
              uses: SamKirkland/FTP-Deploy-Action@v4.3.4
              with:
                  server: ${{ secrets.STAGING_FTP_URL }}
                  username: ${{ secrets.STAGING_FTP_USER }}
                  password: ${{ secrets.STAGING_FTP_PASSWORD }}
                  local-dir: ./build/
